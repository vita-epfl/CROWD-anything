# mypy settings for super-linter (github/super-linter reads .github/linters/.mypy.ini).
[mypy]
# super-linter's default
ignore_missing_imports = True

# Vendored MapAnything code (upstream facebookresearch/map-anything): mypy follows imports into it
# from scripts/demo_images_pose_export.py, but its own type errors are not ours to fix here.
[mypy-mapanything.*]
ignore_errors = True

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" width="760" height="338" role="img" aria-label="Topology judge on real video: agreement with OpenStreetMap">
<title>Topology judge on real video: agreement with OpenStreetMap</title>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #0b0b0b; }
  .sub, .tick, .note { font-size: 12px; fill: #52514e; }
  .label { font-size: 13px; fill: #0b0b0b; }
  .value { font-size: 12px; font-weight: 600; fill: #0b0b0b; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; }
  .box { fill: #fcfcfb; stroke: #c3c2b7; stroke-width: 1.5; }
  .accent { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
  .outside { fill: none; stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .group { fill: none; stroke: #c3c2b7; stroke-width: 1; }
  .arrow { stroke: #898781; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  .head { fill: #898781; }
  @media (prefers-color-scheme: dark) {
    .title, .label, .value { fill: #f0efec; }
    .sub, .tick, .note { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; }
    .box { fill: #1a1a19; stroke: #383835; }
    .accent { fill: #16243a; stroke: #3987e5; }
    .group { stroke: #383835; }
  }
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text x="0.0" y="20.0" class="title" text-anchor="start">Topology judge on real video: agreement with OpenStreetMap</text>
<text x="0.0" y="40.0" class="sub" text-anchor="start">Cohen's κ of Qwen-Drive-4B's answers vs. the map, 402 real NATIX clips (first 5 s); 0 = chance</text>
<line class="axis" x1="170.0" y1="70" x2="170.0" y2="276"/>
<text x="170.0" y="292.0" class="tick" text-anchor="middle">0.0</text>
<line class="grid" x1="276.0" y1="70" x2="276.0" y2="276"/>
<text x="276.0" y="292.0" class="tick" text-anchor="middle">0.1</text>
<line class="grid" x1="382.0" y1="70" x2="382.0" y2="276"/>
<text x="382.0" y="292.0" class="tick" text-anchor="middle">0.2</text>
<line class="grid" x1="488.0" y1="70" x2="488.0" y2="276"/>
<text x="488.0" y="292.0" class="tick" text-anchor="middle">0.3</text>
<line class="grid" x1="594.0" y1="70" x2="594.0" y2="276"/>
<text x="594.0" y="292.0" class="tick" text-anchor="middle">0.4</text>
<line class="grid" x1="700.0" y1="70" x2="700.0" y2="276"/>
<text x="700.0" y="292.0" class="tick" text-anchor="middle">0.5</text>
<text x="158.0" y="92.0" class="label" text-anchor="end">Road type</text>
<path class="s1" d="M170.0,78.0 h462.4 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-462.4 z"/>
<text x="644.4" y="92.0" class="value" text-anchor="start">0.44</text>
<text x="158.0" y="126.0" class="label" text-anchor="end">Pedestrian crossing</text>
<path class="s1" d="M170.0,112.0 h345.8 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-345.8 z"/>
<text x="527.8" y="126.0" class="value" text-anchor="start">0.33</text>
<text x="158.0" y="160.0" class="label" text-anchor="end">One-way</text>
<path class="s1" d="M170.0,146.0 h292.8 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-292.8 z"/>
<text x="474.8" y="160.0" class="value" text-anchor="start">0.28</text>
<text x="158.0" y="194.0" class="label" text-anchor="end">Intersection</text>
<path class="s1" d="M170.0,180.0 h292.8 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-292.8 z"/>
<text x="474.8" y="194.0" class="value" text-anchor="start">0.28</text>
<text x="158.0" y="228.0" class="label" text-anchor="end">Lanes</text>
<path class="s1" d="M170.0,214.0 h261.0 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-261.0 z"/>
<text x="443.0" y="228.0" class="value" text-anchor="start">0.25</text>
<text x="158.0" y="262.0" class="label" text-anchor="end">Traffic signals*</text>
<path class="s1" d="M170.0,248.0 h155.0 a4,4 0 0 1 4,4 v10.0 a4,4 0 0 1 -4,4 h-155.0 z"/>
<text x="337.0" y="262.0" class="value" text-anchor="start">0.15</text>
<text x="0.0" y="330.0" class="note" text-anchor="start">* only 9 of the 402 clips pass traffic signals in their first 5 s, too few to test. Answers are skewed, so κ rather than accuracy.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 366" width="960" height="366" role="img" aria-label="CROWD-anything: from dashcam videos to world-model training data and evaluation">
<title>CROWD-anything: from dashcam videos to world-model training data and evaluation</title>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #0b0b0b; }
  .sub, .tick, .note { font-size: 12px; fill: #52514e; }
  .label { font-size: 13px; fill: #0b0b0b; }
  .value { font-size: 12px; font-weight: 600; fill: #0b0b0b; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; }
  .box { fill: #fcfcfb; stroke: #c3c2b7; stroke-width: 1.5; }
  .accent { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
  .outside { fill: none; stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .group { fill: none; stroke: #c3c2b7; stroke-width: 1; }
  .arrow { stroke: #898781; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  .head { fill: #898781; }
  @media (prefers-color-scheme: dark) {
    .title, .label, .value { fill: #f0efec; }
    .sub, .tick, .note { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; }
    .box { fill: #1a1a19; stroke: #383835; }
    .accent { fill: #16243a; stroke: #3987e5; }
    .group { stroke: #383835; }
  }
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text x="0.0" y="20.0" class="title" text-anchor="start">CROWD-anything: from dashcam videos to world-model training data and evaluation</text>
<rect class="box" x="1" y="48" width="204" height="104" rx="10"/>
<text x="103.0" y="74.0" class="label" font-weight="600" text-anchor="middle">CROWD videos</text>
<text x="103.0" y="94.0" class="sub" text-anchor="middle">dashcam drives worldwide</text>
<text x="103.0" y="110.0" class="sub" text-anchor="middle">mapping.csv: segments</text>
<path class="arrow" d="M209,100.0 L249,100.0"/>
<rect class="box" x="253" y="48" width="204" height="104" rx="10"/>
<text x="355.0" y="74.0" class="label" font-weight="600" text-anchor="middle">Frames + camera poses</text>
<text x="355.0" y="94.0" class="sub" text-anchor="middle">24 fps canonical grid</text>
<text x="355.0" y="110.0" class="sub" text-anchor="middle">MapAnything (main.py)</text>
<path class="arrow" d="M461,100.0 L501,100.0"/>
<rect class="box" x="505" y="48" width="204" height="104" rx="10"/>
<text x="607.0" y="74.0" class="label" font-weight="600" text-anchor="middle">Video latents</text>
<text x="607.0" y="94.0" class="sub" text-anchor="middle">LTX-2 video VAE encoder</text>
<text x="607.0" y="110.0" class="sub" text-anchor="middle">tokenization/</text>
<path class="arrow" d="M713,100.0 L753,100.0"/>
<rect class="outside" x="757" y="48" width="201" height="104" rx="10"/>
<text x="857.5" y="74.0" class="label" font-weight="600" text-anchor="middle">World model</text>
<text x="857.5" y="94.0" class="sub" text-anchor="middle">trained on the latents</text>
<text x="857.5" y="110.0" class="sub" text-anchor="middle">(outside this repository)</text>
<rect class="group" x="0.5" y="204" width="959" height="160" rx="12"/>
<text x="16.0" y="230.0" class="label" font-weight="600" text-anchor="start">evaluation/ — each generated video vs. its real clip</text>
<path class="arrow" d="M858.5,156 L858.5,200"/>
<rect class="accent" x="16" y="246" width="218" height="102" rx="10"/>
<text x="125.0" y="272.0" class="label" font-weight="600" text-anchor="middle">Reconstruction</text>
<text x="125.0" y="292.0" class="sub" text-anchor="middle">paired.py</text>
<text x="125.0" y="308.0" class="sub" text-anchor="middle">PSNR · SSIM · LPIPS</text>
<text x="125.0" y="324.0" class="sub" text-anchor="middle">per frame, by horizon</text>
<rect class="accent" x="248" y="246" width="218" height="102" rx="10"/>
<text x="357.0" y="272.0" class="label" font-weight="600" text-anchor="middle">Road topology</text>
<text x="357.0" y="292.0" class="sub" text-anchor="middle">topology.py</text>
<text x="357.0" y="308.0" class="sub" text-anchor="middle">OSM facts asked to a VLM</text>
<text x="357.0" y="324.0" class="sub" text-anchor="middle">κ vs. the real clip</text>
<rect class="accent" x="480" y="246" width="218" height="102" rx="10"/>
<text x="589.0" y="272.0" class="label" font-weight="600" text-anchor="middle">Prompt following</text>
<text x="589.0" y="292.0" class="sub" text-anchor="middle">prompt_following.py</text>
<text x="589.0" y="308.0" class="sub" text-anchor="middle">LLM splits the caption,</text>
<text x="589.0" y="324.0" class="sub" text-anchor="middle">VLM checks yes / no</text>
<rect class="accent" x="712" y="246" width="218" height="102" rx="10"/>
<text x="821.0" y="272.0" class="label" font-weight="600" text-anchor="middle">Traffic elements</text>
<text x="821.0" y="292.0" class="sub" text-anchor="middle">traffic_elements.py</text>
<text x="821.0" y="308.0" class="sub" text-anchor="middle">Grounding DINO + DINOv2,</text>
<text x="821.0" y="324.0" class="sub" text-anchor="middle">matched in time and place</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Prompt-following judge on real video: own caption vs. another clip's caption">
<title>Prompt-following judge on real video: own caption vs. another clip's caption</title>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #0b0b0b; }
  .sub, .tick, .note { font-size: 12px; fill: #52514e; }
  .label { font-size: 13px; fill: #0b0b0b; }
  .value { font-size: 12px; font-weight: 600; fill: #0b0b0b; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; }
  .box { fill: #fcfcfb; stroke: #c3c2b7; stroke-width: 1.5; }
  .accent { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
  .outside { fill: none; stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .group { fill: none; stroke: #c3c2b7; stroke-width: 1; }
  .arrow { stroke: #898781; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  .head { fill: #898781; }
  @media (prefers-color-scheme: dark) {
    .title, .label, .value { fill: #f0efec; }
    .sub, .tick, .note { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; }
    .s1 { fill: #3987e5; } .s2 { fill: #d95926; }
    .box { fill: #1a1a19; stroke: #383835; }
    .accent { fill: #16243a; stroke: #3987e5; }
    .group { stroke: #383835; }
  }
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text x="0.0" y="20.0" class="title" text-anchor="start">Prompt-following judge on real video: own caption vs. another clip's caption</text>
<text x="0.0" y="40.0" class="sub" text-anchor="start">Share of caption statements Qwen-Drive-4B judges correctly, 30 real clips (statements split by Qwen3-32B)</text>
<rect class="s1" x="56.0" y="56" width="12" height="12" rx="2"/>
<text x="74.0" y="66.0" class="label" text-anchor="start">Clip with its own caption</text>
<rect class="s2" x="271.0" y="56" width="12" height="12" rx="2"/>
<text x="289.0" y="66.0" class="label" text-anchor="start">Clip with another clip's caption (control)</text>
<line class="axis" x1="56" y1="290.0" x2="750" y2="290.0"/>
<text x="48.0" y="294.0" class="tick" text-anchor="end">0%</text>
<line class="grid" x1="56" y1="240.5" x2="750" y2="240.5"/>
<text x="48.0" y="244.5" class="tick" text-anchor="end">25%</text>
<line class="grid" x1="56" y1="191.0" x2="750" y2="191.0"/>
<text x="48.0" y="195.0" class="tick" text-anchor="end">50%</text>
<line class="grid" x1="56" y1="141.5" x2="750" y2="141.5"/>
<text x="48.0" y="145.5" class="tick" text-anchor="end">75%</text>
<line class="grid" x1="56" y1="92.0" x2="750" y2="92.0"/>
<text x="48.0" y="96.0" class="tick" text-anchor="end">100%</text>
<path class="s1" d="M114.7,290.0 v-175.6 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 v175.6 z"/>
<text x="142.7" y="104.4" class="value" text-anchor="middle">91%</text>
<path class="s2" d="M172.7,290.0 v-58.2 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 v58.2 z"/>
<text x="200.7" y="221.8" class="value" text-anchor="middle">31%</text>
<text x="171.7" y="310.0" class="label" text-anchor="middle">True statements confirmed</text>
<text x="171.7" y="326.0" class="tick" text-anchor="middle">static scene</text>
<path class="s1" d="M346.0,290.0 v-168.3 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 v168.3 z"/>
<text x="374.0" y="111.7" class="value" text-anchor="middle">87%</text>
<path class="s2" d="M404.0,290.0 v-51.0 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 v51.0 z"/>
<text x="432.0" y="229.0" class="value" text-anchor="middle">28%</text>
<text x="403.0" y="310.0" class="label" text-anchor="middle">True statements confirmed</text>
<text x="403.0" y="326.0" class="tick" text-anchor="middle">dynamics</text>
<path class="s1" d="M577.3,290.0 v-174.2 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 v174.2 z"/>
<text x="605.3" y="105.8" class="value" text-anchor="middle">90%</text>
<path class="s2" d="M635.3,290.0 v-182.9 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 v182.9 z"/>
<text x="663.3" y="97.1" class="value" text-anchor="middle">94%</text>
<text x="634.3" y="310.0" class="label" text-anchor="middle">False statements rejected</text>
<text x="634.3" y="326.0" class="tick" text-anchor="middle">near-misses</text>
<text x="0.0" y="354.0" class="note" text-anchor="start">A judge that reads the video confirms far fewer statements of the wrong caption; false statements stay false on any clip.</text>
</svg>
